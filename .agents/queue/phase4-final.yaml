queue:
  - name: "1. Plan resumption"
    prompt: >
      Implement the resumeActivePlans() method in the orchestrator so interrupted multi-step plans can recover after restart.
      Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/orchestrator.ts and find the stubbed resumeActivePlans() with "TODO Implement plan resumption".
      Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/plan-store.ts for the plan persistence layer.
      Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/task-planner.ts for TaskPlan, TaskStep interfaces. 
      Step 1 - In plan-store.ts, add a function getTaskPlan(planId, db) that queries the task_plans table for the plan row, queries the task_steps table for all steps belonging to that plan, reconstructs and returns a TaskPlan object (or null if not found). Use defensive error handling.
      Step 2 - In orchestrator.ts, replace the stub with a real implementation. Import getTaskPlan from plan-store.js. Query for plans with status executing or planning. For each plan, call getTaskPlan() to reconstruct it. Skip steps already completed. Use the existing runPlan() function. Log progress. Wrap in try/catch. Run sequentially.
      Step 3 - Handle the case where task_plans/task_steps tables dont exist yet.
      After implementing, run npm run build --prefix ubot-core. Fix errors. Commit with message "feat: implement plan resumption for interrupted multi-step tasks"

  - name: "2. Prompt A/B testing framework"
    prompt: >
      Create a prompt A/B testing framework that compares different system prompt variants by tracking tool routing accuracy.
      Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/types.ts for SYSTEM_PROMPT.
      Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/orchestrator.ts for how system prompt is injected.
      Read /Users/pretheesh/Projects/ubot/ubot-core/src/metrics/index.ts for MetricsCollector.
      Read /Users/pretheesh/Projects/ubot/ubot-core/src/data/database/types.ts for DatabaseConnection.
      Create /Users/pretheesh/Projects/ubot/ubot-core/src/engine/prompt-experiment.ts with these interfaces -
      PromptVariant with fields id (string), name (string), promptOverride (string), isPartial (boolean).
      PromptExperiment with fields id, name, description, variants array, trafficSplit number array, active boolean, createdAt Date.
      ExperimentResult with experimentId, variantId, sessionId, toolCalls, toolSuccesses, toolFailures, responseTimeMs, timestamp.
      Create a class PromptExperimentManager with methods -
      createExperiment, getActiveExperiment (only one active at a time), assignVariant (hash-based stable assignment using sessionId),
      recordResult (stores to SQLite), getResults (aggregate per variant), deactivateExperiment.
      Create SQLite tables prompt_experiments and experiment_results.
      Hash function for variant assignment uses sessionId chars reduced with h*31+charcode mod 100.
      Export singleton promptExperiments and initPromptExperiments(db) function.
      Add API endpoints GET /api/experiments, POST /api/experiments, GET /api/experiments/experimentId/results, POST /api/experiments/experimentId/deactivate in /Users/pretheesh/Projects/ubot/ubot-core/src/api/index.ts.
      Wire into orchestrator chat method - after system prompt built, call assignVariant. If partial append, if full replace. After chat, recordResult with turn metrics.
      Run npm run build --prefix ubot-core. Fix errors. Commit "feat: prompt A/B testing framework with SQLite persistence"

  - name: "3. Auto-generate skills from successful workflows"
    prompt: >
      Add auto-skill detection that recognizes when the agent completes a complex multi-tool workflow and offers to save it as a reusable skill.
      Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/orchestrator.ts for afterTurn hooks.
      Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/middleware.ts for AgentMiddleware interface.
      Read /Users/pretheesh/Projects/ubot/ubot-core/src/agents/skills/skill-engine.ts for skill creation.
      Create /Users/pretheesh/Projects/ubot/ubot-core/src/engine/middlewares/skill-detector-middleware.ts.
      Export class SkillDetectorMiddleware implementing AgentMiddleware with name SkillDetectorMiddleware.
      In afterTurn, check if turn had 4+ tool calls AND all succeeded AND at least 2 different tool names.
      If conditions met, log the detection and store a SkillSuggestion in a module-level Map keyed by sessionId.
      The suggestion should have auto-generated name from tool sequence, description, toolSequence array, and suggestedPrompt.
      Add a save_suggested_skill tool that looks up the suggestion for a session and creates the skill.
      Store pending offers in a Set. In beforeIteration, if session has pending offer, inject system message about it.
      Register middleware in orchestrators pipeline alongside LoggingMiddleware, CircuitBreakerMiddleware, RetryMiddleware.
      Add barrel export in /Users/pretheesh/Projects/ubot/ubot-core/src/engine/middlewares/index.ts.
      Run npm run build --prefix ubot-core. Fix errors. Commit "feat: auto-detect successful workflows and offer skill creation"

  - name: "4. Build, deploy, and verify"
    prompt: >
      Build, deploy locally, deploy to remote, and verify everything works.
      Step 1 - cd /Users/pretheesh/Projects/ubot and run npm run build --prefix ubot-core. If build errors, fix them and rebuild until clean.
      Step 2 - Run make update to build web UI, install, and restart.
      Step 3 - Wait 5 seconds then verify server running with curl -s http://localhost:11490/api/health.
      Step 4 - git add -A and commit with message "feat: Phase 4 complete"
      Step 5 - git push origin master
      Step 6 - Deploy to remote with rsync -az /Users/pretheesh/Projects/ubot/ubot-core/dist/ ubot-server:/root/.ubot/lib/
      Step 7 - Restart remote with ssh ubot-server "export PATH=$PATH:/root/.local/bin && ubot restart"
      Step 8 - Verify remote health endpoint
      Step 9 - Show git log --oneline -12
