queue:
  - name: "1. SQLite-backed todo persistence"
    prompt: |
      The write_todos tool at /Users/pretheesh/Projects/ubot/ubot-core/src/engine/todo-store.ts currently uses an in-memory Map. Todos are lost on restart. Migrate it to SQLite.

      Requirements:
      1. Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/todo-store.ts to understand the current API: getTodos(sessionId), writeTodos(sessionId, todos), clearTodos(sessionId)
      2. Read /Users/pretheesh/Projects/ubot/ubot-core/src/memory/conversation.ts to see how SQLite is used in UBOT (it uses the DatabaseConnection interface from ../data/database/types.js)
      3. Also read /Users/pretheesh/Projects/ubot/ubot-core/src/data/database/types.ts for the DatabaseConnection interface
      4. Modify todo-store.ts to accept an optional DatabaseConnection. If provided, use SQLite. If not, fall back to in-memory (for tests).
      5. Create a `todos` table with columns: id TEXT PRIMARY KEY, session_id TEXT NOT NULL, task TEXT NOT NULL, status TEXT NOT NULL DEFAULT 'pending', created_at TEXT, updated_at TEXT
      6. Add a migration export like conversationMigrations in conversation.ts
      7. Wire the database connection in /Users/pretheesh/Projects/ubot/ubot-core/src/engine/todo-tools.ts — read it to see how the store is currently used and pass the db connection from the ToolContext
      8. Check /Users/pretheesh/Projects/ubot/ubot-core/src/tools/types.ts for the ToolContext interface — if it doesn't have a db field, add one
      9. Wire the db into ToolContext in /Users/pretheesh/Projects/ubot/ubot-core/src/index.ts where the tool registry is set up

      Also persist async jobs: Read /Users/pretheesh/Projects/ubot/ubot-core/src/api/routes/chat.ts and find the asyncJobs Map. Leave the async jobs in-memory for now (they're short-lived, 5 min TTL), but add a comment noting they could be persisted later.

      After implementing, run `npm run build --prefix ubot-core` to verify compilation. Fix any errors. Commit with message "feat: SQLite-backed todo persistence — todos survive restarts"

  - name: "2. Health status API endpoint"
    prompt: |
      Add a /api/health endpoint that exposes the full system health to the dashboard and external monitors.

      Read /Users/pretheesh/Projects/ubot/ubot-core/src/capabilities/mcp/health-monitor.ts to see the getHealthStatus() function.
      Read /Users/pretheesh/Projects/ubot/ubot-core/src/api/routes/chat.ts to see how API routes are structured.

      Requirements:
      1. In the main API router at /Users/pretheesh/Projects/ubot/ubot-core/src/api/index.ts, find the existing /api/health endpoint (search for "health")
      2. Enhance it to include:
         - server: { uptime: process.uptime(), version: '1.0.0', pid: process.pid }
         - cdp: getHealthStatus() from the health monitor
         - mcp: { connected: number of connected MCP servers from ctx.mcpManager }
         - memory: { rss: process.memoryUsage().rss, heap: process.memoryUsage().heapUsed }
         - tools: { registered: number of registered tools from registry or agentOrchestrator }
      3. Return HTTP 200 if everything is healthy, HTTP 503 if critical services are down
      4. Do NOT require authentication for /api/health (it's used by external monitors)

      After implementing, run `npm run build --prefix ubot-core`. Commit with message "feat: comprehensive /api/health endpoint with CDP, MCP, and tool status"

  - name: "3. Memory expiry for error context"
    prompt: |
      The SUMMARY_UPDATE_PROMPT in /Users/pretheesh/Projects/ubot/ubot-core/src/memory/soul.ts already says "NEVER record tool errors." But the raw conversation history still contains error messages from failed tools that can pollute future context windows.

      Requirements:
      1. Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/orchestrator.ts and find where messages are built for the LLM context (search for "messages" array construction and "getHistory")
      2. Read /Users/pretheesh/Projects/ubot/ubot-core/src/memory/conversation.ts to understand getHistory()
      3. Add a message filtering step BEFORE sending to the LLM: when building the messages array from history, filter out tool role messages that contain "TOOL FAILED" if they are older than 1 hour. This prevents stale error context from accumulating.
      4. Implement this as a function called `filterStaleErrors(messages: Array<{role: string, content: string, timestamp?: string}>, maxAgeMs: number = 3600000)` that:
         - Keeps all non-tool messages
         - Keeps recent tool failure messages (within maxAgeMs)
         - Drops old tool failure messages (older than maxAgeMs)
         - Always keeps successful tool messages
      5. Place this function in a new file /Users/pretheesh/Projects/ubot/ubot-core/src/engine/message-filter.ts
      6. Import and apply it in the orchestrator where history messages are loaded (look for getHistory calls)

      After implementing, run `npm run build --prefix ubot-core`. Commit with message "feat: auto-expire stale tool error messages from LLM context"

  - name: "4. Cross-turn continuation for long tasks"
    prompt: |
      When a task needs more than maxToolIterations (25), the agent loop exits and the task is abandoned. Add a continuation mechanism.

      Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/orchestrator.ts and find:
      1. The while loop at around `while (iteration < currentConfig.maxToolIterations)`
      2. Where the loop exits when iterations are exhausted
      3. The write_todos tool usage

      Requirements:
      1. When the agent loop exhausts maxToolIterations and there are still pending/in_progress todos:
         - Instead of just stopping, add a final system message telling the agent: "You've used all available iterations. Summarize what you've completed so far and what remains."
         - Schedule an automatic follow-up using the schedule_followup mechanism (read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/session-tools.ts to understand how schedule_followup works)
         - The follow-up should fire after 5 seconds with a message like "Please continue the remaining tasks from the previous turn. Check write_todos for incomplete items."
      2. In the exit path of the while loop (after it finishes), check if there are pending todos for the session:
         - Import getTodos from './todo-store.js'
         - If there are pending/in_progress items, schedule the continuation
         - Log: `[Agent] Task continuation scheduled: ${pendingCount} todos remaining`
      3. Add a `continuationCount` tracker to prevent infinite continuation loops (max 3 continuations per original request)
         - Store this in a simple Map<sessionId, number> that resets when a new user message arrives

      Keep changes minimal. After implementing, run `npm run build --prefix ubot-core`. Commit with message "feat: auto-continue incomplete tasks across agent turns"

  - name: "5. Behavioral smoke test suite"
    prompt: |
      Create a behavioral test script that validates the agent calls the right tools for known request patterns. This runs against a live UBOT instance.

      Requirements:
      1. Create /Users/pretheesh/Projects/ubot/ubot-core/scripts/behavior-tests.sh
      2. The script should:
         - Accept a BASE_URL parameter (default: http://localhost:11490)
         - Login and get a session cookie
         - Run each test: POST /api/chat with a known message, check the response for expected tool calls
         - Track pass/fail counts
         - Print a summary at the end
      3. Test cases (minimum 10):
         - "What is 2+2?" → should have NO tool calls (pure LLM)
         - "Search the web for latest AI news" → should call web_search or mcp_tavily_search
         - "What time is it?" → should call get_current_datetime
         - "Send a WhatsApp message to +1234567890 saying hello" → should call send_whatsapp_message
         - "Schedule a reminder for tomorrow at 9am" → should call schedule_followup
         - "Navigate to google.com" → should call mcp_playwright_browser_navigate
         - "Create a skill that replies with hello" → should call create_skill
         - "Read the file /etc/hostname" → should call read_file
         - "Run the command ls -la" → should call execute_command
         - Empty message → should return HTTP 400
      4. Each test should:
         - Send the request with a unique sessionId
         - Parse the JSON response
         - Check if the expected tool name appears in the toolCalls array
         - Print ✅ or ❌ with the test name
         - Allow 30s timeout per test (some trigger multi-tool chains)
      5. Make the script executable (chmod +x)
      6. The script should be idempotent — safe to run multiple times

      After creating, run `chmod +x /Users/pretheesh/Projects/ubot/ubot-core/scripts/behavior-tests.sh`. Commit with message "feat: behavioral smoke test suite — 10 tests for tool routing validation"

  - name: "6. Deploy to remote server and verify"
    prompt: |
      Deploy all changes to the remote production server and verify everything works.

      Follow the deploy workflow at /Users/pretheesh/Projects/ubot/.agents/workflows/deploy.md EXACTLY.

      Steps:
      1. Show recent commits: `cd /Users/pretheesh/Projects/ubot && git log --oneline -10`
      2. Build: `npm run build --prefix ubot-core`
      3. Sync to remote: `rsync -az /Users/pretheesh/Projects/ubot/ubot-core/dist/ ubot-server:/root/.ubot/lib/`
      4. Sync credentials: `rsync -az ~/.ubot/vertex-credentials.json ubot-server:/root/.ubot/`
      5. Do NOT sync config.json to remote (config drift is intentional — remote has CDP endpoint)
      6. Restart on remote: `ssh ubot-server "export PATH=\$PATH:/root/.local/bin && ubot restart"`
      7. Wait 5 seconds, then verify: `ssh ubot-server "ubot logs | tail -15"`
      8. Verify Chrome CDP: `ssh ubot-server "curl -s http://127.0.0.1:9222/json/version | head -3"`
      9. Verify health endpoint: `ssh ubot-server "curl -s http://localhost:11490/api/health | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps(d,indent=2))'"` 
      10. Report results

      Do NOT clear any chat messages, digests, or agent memories on the server.
      Commit any remaining changes before deploying.
