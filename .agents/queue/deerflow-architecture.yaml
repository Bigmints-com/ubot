queue:
  - name: "1. Middleware pipeline foundation"
    prompt: "Create a middleware pipeline system for UBOT's agent orchestrator, inspired by DeerFlow's architecture. The orchestrator at /Users/pretheesh/Projects/ubot/ubot-core/src/engine/orchestrator.ts has all its logic (retry, circuit breaker, logging, token truncation, loop detection) tangled in a single while-loop. We need to extract this into composable middleware. Create a new file at /Users/pretheesh/Projects/ubot/ubot-core/src/engine/middleware.ts. Define these TypeScript interfaces and classes: 1) AgentMessage interface with role (string), content (string), optional tool_call_id (string) and tool_calls (any[]). 2) MiddlewareContext interface with messages (AgentMessage[]), toolName (string), toolArgs (Record<string, any>), toolCallId (optional string), sessionId (string), iteration (number), maxIterations (number). 3) MiddlewareResult interface with optional fields: skipExecution (ToolExecutionResult from types.js), injectMessage (AgentMessage), shouldBreak (boolean), breakReason (string). 4) AgentMiddleware interface with name (string) property and optional async methods: beforeTool(ctx: MiddlewareContext) returning Promise<MiddlewareResult | null>, afterTool(ctx: MiddlewareContext, result: ToolExecutionResult) returning Promise<MiddlewareResult | null>, beforeIteration(ctx: {iteration, maxIterations, sessionId, messages}) returning Promise<MiddlewareResult | null>, afterTurn(ctx: {iterations, toolResults: ToolExecutionResult[], sessionId}) returning Promise<void>. 5) MiddlewarePipeline class with use(middleware: AgentMiddleware) returning this for chaining, getMiddlewares() returning AgentMiddleware[], and async methods: runBeforeTool(ctx) that iterates all middlewares calling beforeTool and returns first non-null result, runAfterTool(ctx, result) same pattern, runBeforeIteration(ctx) same pattern, runAfterTurn(ctx) that calls all afterTurn middlewares. Import ToolExecutionResult from './types.js'. After creating, run npm run build --prefix ubot-core to verify it compiles. Then git add and commit with message 'feat: add middleware pipeline foundation for agent orchestrator'."

  - name: "2. Extract retry into middleware"
    prompt: "Create a RetryMiddleware for UBOT's middleware pipeline. Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/middleware.ts first to understand the AgentMiddleware interface. Then read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/orchestrator.ts and find the isTransientError function and the retry logic around tool execution. Create a new directory /Users/pretheesh/Projects/ubot/ubot-core/src/engine/middlewares/ and create /Users/pretheesh/Projects/ubot/ubot-core/src/engine/middlewares/retry-middleware.ts. It should export a class RetryMiddleware that implements AgentMiddleware from '../middleware.js'. The constructor takes an executeToolFn parameter of type (toolName: string, args: Record<string, any>) => Promise<ToolExecutionResult>. Copy the isTransientError function from orchestrator.ts into this file (checking for patterns: timeout, ECONNREFUSED, -32001, network, ETIMEDOUT). Implement the afterTool method: if the tool result indicates failure (.success === false) and isTransientError returns true for the error text, retry up to 2 times with exponential backoff (await new Promise(r => setTimeout(r, delay)) with delay starting at 2000 then 4000). On each retry, use executeToolFn to re-execute the tool, and log with log from '../../logger/ring-buffer.js'. If retry succeeds, return a MiddlewareResult with skipExecution set to the successful result. If all retries fail, return null to let the original failure through. Set name property to 'RetryMiddleware'. After creating, run npm run build --prefix ubot-core. Then git add and commit with message 'feat: extract retry logic into RetryMiddleware'."

  - name: "3. Extract circuit breaker into middleware"
    prompt: "Create a CircuitBreakerMiddleware for UBOT's middleware pipeline. Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/middleware.ts first for the interface. Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/circuit-breaker.ts to understand the existing CircuitBreaker class. Create /Users/pretheesh/Projects/ubot/ubot-core/src/engine/middlewares/circuit-breaker-middleware.ts. It should export a class CircuitBreakerMiddleware implementing AgentMiddleware. Import getCircuitBreaker from '../circuit-breaker.js'. Implement beforeTool: check if the circuit is open for the toolName using the circuit breaker, if it is open, return a MiddlewareResult with skipExecution containing a ToolExecutionResult that has toolName, success: false, and result with an error message saying browser tools are temporarily unavailable. Implement afterTool: if the tool result was successful, call recordSuccess on the circuit breaker for the tool. If it failed, call recordFailure. Set name to 'CircuitBreakerMiddleware'. After creating, run npm run build --prefix ubot-core. Then git add and commit with message 'feat: extract circuit breaker into CircuitBreakerMiddleware'."

  - name: "4. Extract logging into middleware and create barrel"
    prompt: "Create a LoggingMiddleware for UBOT's middleware pipeline and a barrel export file. Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/middleware.ts first. Create /Users/pretheesh/Projects/ubot/ubot-core/src/engine/middlewares/logging-middleware.ts. Export class LoggingMiddleware implementing AgentMiddleware. Use a private Map<string, number> called startTimes to track tool timing. In beforeTool: store Date.now() keyed by the toolCallId or toolName. In afterTool: compute duration from the stored start time, then log using log from '../../logger/ring-buffer.js'. For success (result.success === true): log.info('Agent', checkmark + space + toolName + space + open-paren + duration + 'ms' + close-paren). For failure: log.warn('Agent', X + space + toolName + space + open-paren + duration + 'ms' + close-paren + colon + space + result.result). In afterTurn: log.info('Agent', summary line with iterations, total tool calls, success count with checkmark, failure count with X). If there are failures, log.warn with each failed tool name and error. Set name to 'LoggingMiddleware'. Then create /Users/pretheesh/Projects/ubot/ubot-core/src/engine/middlewares/index.ts that re-exports from './retry-middleware.js', './circuit-breaker-middleware.js', and './logging-middleware.js'. After creating all files, run npm run build --prefix ubot-core. Then git add and commit with message 'feat: extract logging into LoggingMiddleware with turn summary'."

  - name: "5. Wire middleware pipeline into orchestrator"
    prompt: "Wire the new middleware pipeline into UBOT's orchestrator, replacing inline retry, circuit breaker, and logging logic. Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/orchestrator.ts carefully to understand the full file. Read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/middleware.ts and /Users/pretheesh/Projects/ubot/ubot-core/src/engine/middlewares/index.ts. Now modify orchestrator.ts: 1) Add imports at the top: import { MiddlewarePipeline } from './middleware.js' and import { RetryMiddleware, CircuitBreakerMiddleware, LoggingMiddleware } from './middlewares/index.js'. 2) Inside the chat method, BEFORE the while loop starts (near where toolResults array is declared), create the pipeline: const pipeline = new MiddlewarePipeline().use(new LoggingMiddleware()).use(new CircuitBreakerMiddleware()).use(new RetryMiddleware(async (name, args) => toolRegistry.execute({ toolName: name, arguments: args, rawText: '' }))). 3) In the tool execution section (the for-loop over toolCalls), REPLACE the inline circuit breaker check with a call to pipeline.runBeforeTool(ctx) where ctx has the tool info. If the result has skipExecution, use that instead of executing the tool. 4) REPLACE the inline retry logic with a call to pipeline.runAfterTool(ctx, result). If the result has skipExecution (from retry), use that result. 5) REMOVE the inline logging lines (the checkmark/X format like 'log.info Agent checkmark' and 'log.warn Agent X'). 6) REPLACE the turn summary block after the while loop with pipeline.runAfterTurn({iterations: iteration, toolResults, sessionId}). 7) Remove the inline isTransientError function since it's now in RetryMiddleware. 8) Remove the direct import of getCircuitBreaker since it's now in CircuitBreakerMiddleware. KEEP all other logic intact: alias resolution, token guard, loop detection, message building, LLM calling, auto-triage. After refactoring, run npm run build --prefix ubot-core. Fix any build errors. Then run npm test --prefix ubot-core. Commit with message 'refactor: wire middleware pipeline into orchestrator, remove inline logic'."

  - name: "6. Add write_todos tool for progress tracking"
    prompt: "Add a write_todos tool to UBOT for progress tracking on complex tasks. First, read how tools are registered by examining /Users/pretheesh/Projects/ubot/ubot-core/src/tools/registry.ts. Understand the tool registration pattern used in UBOT. Then create /Users/pretheesh/Projects/ubot/ubot-core/src/engine/todo-store.ts with: a TodoItem interface (id: string, task: string, status: 'pending' | 'in_progress' | 'completed' | 'failed', createdAt: Date, updatedAt: Date), a Map<string, TodoItem[]> for in-memory storage, and exports: getTodos(sessionId: string) returning TodoItem[], writeTodos(sessionId: string, todos: Array<{id?: string, task: string, status: string}>) returning TodoItem[], clearTodos(sessionId: string). Log progress with log from '../logger/ring-buffer.js'. Next, register a write_todos tool following the same pattern as other tools in the registry. Description: 'Create or update a task list for complex multi-step workflows. Only use for tasks with 3+ steps. Each todo has task (string description) and status (pending, in_progress, completed, or failed). Mark tasks as completed IMMEDIATELY after finishing each step. Keep exactly one task as in_progress at a time.' Parameters should include a todos array parameter. Finally, in /Users/pretheesh/Projects/ubot/ubot-core/src/engine/types.ts, add a section to the system prompt (the SYSTEM_PROMPT constant) after the Evidence-Based Verification section. Add a section called Task Progress Tracking that tells the agent to use write_todos for complex 3+ step tasks, mark each step in_progress before starting, completed immediately after with evidence, and keep one task in_progress at a time. After all changes, run npm run build --prefix ubot-core. Commit with message 'feat: add write_todos tool for progress tracking'."

  - name: "7. Add SubagentRunner for delegated task execution"
    prompt: "Create a SubagentRunner that can spawn isolated agent loops for sub-tasks. First read /Users/pretheesh/Projects/ubot/ubot-core/src/engine/orchestrator.ts to understand the AgentOrchestrator interface and its chat method signature. Create /Users/pretheesh/Projects/ubot/ubot-core/src/engine/subagent-types.ts with: SubagentStatus type as 'pending' | 'running' | 'completed' | 'failed' | 'timed_out', SubagentConfig interface with name (string), optional systemPrompt (string), optional allowedTools (string[]), optional deniedTools (string[]), optional maxIterations (number, default 15), optional timeoutMs (number, default 120000), and SubagentResult interface with taskId (string), status (SubagentStatus), optional result (string), optional error (string), startedAt (Date), optional completedAt (Date), toolCalls (number), iterations (number). Then create /Users/pretheesh/Projects/ubot/ubot-core/src/engine/subagent-runner.ts. Export an async function runSubagent that takes config (SubagentConfig), task (string), and an object with a chat method matching the orchestrator's signature. It should: generate a unique sessionId like subagent-configname-timestamp, create a race between the actual chat call and a timeout, log state transitions with log.info using Subagent:name prefix, return SubagentResult with appropriate status. On timeout, resolve with timed_out not throw. On error, resolve with failed status. Then read the tool registry and register a task tool that takes description (string), prompt (string), and optional subagent_type (string, default 'general'). The tool should call runSubagent and return the formatted result. After all changes, run npm run build --prefix ubot-core. Commit with message 'feat: add SubagentRunner for delegated task execution'."

  - name: "8. Deploy and verify all changes"
    prompt: "Deploy all the architectural improvements to the production server. Run these steps in order: 1) cd /Users/pretheesh/Projects/ubot && git log --oneline -10 to show all commits. 2) npm run build --prefix ubot-core to verify the build. If it fails, fix the errors and rebuild. 3) rsync -az /Users/pretheesh/Projects/ubot/ubot-core/dist/ ubot-server:/root/.ubot/lib/ to deploy. 4) ssh ubot-server 'export PATH=$PATH:/root/.local/bin && ubot restart && sleep 6 && ubot logs 2>&1 | tail -15' to restart and show logs. 5) ssh ubot-server 'curl -s http://127.0.0.1:9222/json/version | head -3' to verify Chrome CDP. Do NOT clear any chat messages, digests, or agent memories on the server. Report a summary of all changes made."
