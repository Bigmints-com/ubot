queue:
  - name: "1. Tool retry logic with backoff"
    prompt: |
      In /Users/pretheesh/Projects/ubot/ubot-core/src/engine/orchestrator.ts, add automatic retry logic for transient tool failures in the agent loop.

      Requirements:
      - When a tool call fails with a transient error (timeout, connection refused, MCP error -32001), retry up to 2 times with exponential backoff (2s, 4s)
      - Do NOT retry on permanent errors (auth failures, invalid arguments, tool not found)
      - Log each retry attempt: `[Agent] Retrying ${toolName} (attempt ${n}/2): ${error}`
      - After exhausting retries, proceed as normal (let the model see the failure)
      - Add a helper function `isTransientError(error: string): boolean` that checks for timeout, ECONNREFUSED, -32001, network, ETIMEDOUT patterns
      - Place the retry logic around the `toolRegistry.execute()` call at around line 921

      After implementing, run `npm run build --prefix ubot-core` to verify it compiles. Commit with message "feat: add auto-retry with backoff for transient tool failures"

  - name: "2. Evidence-based tool completion verification"
    prompt: |
      In /Users/pretheesh/Projects/ubot/ubot-core/src/engine/types.ts, update the system prompt to require evidence-based completion.

      Add a new section after "## Action Completion — MANDATORY" called "## Evidence-Based Verification — MANDATORY":

      ```
      ## Evidence-Based Verification — MANDATORY
      When performing multi-step browser tasks:
      - After EVERY significant action (click, fill, submit), call browser_snapshot to VERIFY the action worked
      - NEVER assume an action succeeded — check the page state
      - If a page doesn't change after a click, try a different approach (different selector, scroll first, etc.)
      - After completing a task (e.g. publishing an article), take a screenshot or snapshot as PROOF
      - Report the evidence to the user: "Published ✓ — I can see the confirmation page showing [specific text]"
      - If you can't verify completion, tell the user honestly: "I clicked Publish but couldn't verify it went through"
      ```

      After implementing, run `npm run build --prefix ubot-core` to verify it compiles. Commit with message "feat: add evidence-based verification rules to system prompt"

  - name: "3. Structured tool execution logging"
    prompt: |
      In /Users/pretheesh/Projects/ubot/ubot-core/src/engine/orchestrator.ts, improve the tool execution logging to be structured and useful for debugging.

      Requirements:
      1. Create a structured log entry for each tool call with:
         - Tool name, arguments (truncated to 200 chars), duration in ms, success/fail, result preview (first 200 chars)
      2. At the END of the agent loop (after the while loop exits), log a summary:
         - `[Agent] Turn complete: ${iteration} iterations, ${toolResults.length} tool calls, ${toolResults.filter(t=>t.success).length} succeeded, ${toolResults.filter(t=>!t.success).length} failed`
      3. For failed tools, include the full error in the summary log line
      4. Keep the existing per-tool-call log but make it more concise: `[Agent] ✓ ${toolName} (${duration}ms)` for success, `[Agent] ✗ ${toolName} (${duration}ms): ${error}` for failure

      The existing verbose log at line ~938 (`Tool result [${resolvedToolName}]: success=...`) should be replaced with the concise format.

      After implementing, run `npm run build --prefix ubot-core` to verify it compiles. Commit with message "feat: structured tool execution logging with turn summaries"

  - name: "4. Health monitoring for Chrome CDP"
    prompt: |
      Create a new file at /Users/pretheesh/Projects/ubot/ubot-core/src/capabilities/mcp/health-monitor.ts that monitors Chrome CDP and Playwright MCP health.

      Requirements:
      1. Export a `startHealthMonitor(interval: number)` function that runs a check every `interval` ms (default 60000)
      2. Each check:
         - Calls `http.get('http://127.0.0.1:9222/json/version')` to verify Chrome CDP is alive
         - If CDP is down, log `[Health] ⚠️ Chrome CDP not responding on port 9222`
         - If CDP is up, log nothing (quiet when healthy)
      3. Export a `getHealthStatus()` function that returns `{ cdp: boolean, lastCheck: Date }`
      4. The monitor should be safe to run on any environment (don't crash if Chrome isn't expected to be there)

      Then integrate it in /Users/pretheesh/Projects/ubot/ubot-core/src/index.ts:
      - Import and call `startHealthMonitor(60000)` during startup, AFTER MCP servers are connected
      - Only start if the playwright MCP server is configured

      After implementing, run `npm run build --prefix ubot-core` to verify it compiles. Commit with message "feat: add Chrome CDP health monitoring"

  - name: "5. Config protection on deploy"
    prompt: |
      In /Users/pretheesh/Projects/ubot/Makefile, fix the `install` / `update` targets so that deploy NEVER overwrites remote MCP server configurations (cdp-endpoint, timeouts, etc.).

      Look at the current Makefile at /Users/pretheesh/Projects/ubot/Makefile. Find where config.json is synced/updated and ensure:
      1. The `capabilities.mcp.servers` section is NEVER overwritten during deploy
      2. Only NEW config keys are merged, existing values are preserved (this may already work via "config updated (new keys merged)" logic)
      3. Add a comment in the Makefile explaining this protection

      Also check /Users/pretheesh/Projects/ubot/scripts/install.sh or similar install scripts to find where the config merge happens and verify it protects MCP settings.

      After implementing any changes, commit with message "fix: protect MCP server config from deploy overwrites"

  - name: "6. Circuit breaker for browser tools"
    prompt: |
      In /Users/pretheesh/Projects/ubot/ubot-core/src/engine/orchestrator.ts, add a simple circuit breaker for MCP browser tools.

      Requirements:
      1. Create a `CircuitBreaker` class (can be in the same file or a new file at /Users/pretheesh/Projects/ubot/ubot-core/src/engine/circuit-breaker.ts):
         - Track consecutive failures per tool prefix (e.g. "mcp_playwright_browser_")
         - After 3 consecutive failures of ANY browser tool, "open" the circuit
         - When circuit is open, immediately return a failure: "Browser tools are temporarily unavailable after 3 consecutive failures. The browser service may need to be restarted."
         - Circuit auto-resets after 2 minutes (allow one test call through)
         - Expose `recordSuccess(toolName)`, `recordFailure(toolName)`, `isOpen(toolPrefix): boolean`
      2. Integrate in the tool execution section of orchestrator.ts:
         - Before executing a tool, check if the circuit is open for its prefix
         - After execution, record success or failure
      3. Log circuit state changes: `[CircuitBreaker] Browser tools circuit OPENED after 3 failures`, `[CircuitBreaker] Browser tools circuit CLOSED (recovered)`

      After implementing, run `npm run build --prefix ubot-core` to verify it compiles. Commit with message "feat: add circuit breaker for browser tool failures"

  - name: "7. Deploy and verify all changes"
    prompt: |
      All the reliability improvements have been committed. Now deploy everything to the remote server and verify.

      Steps:
      1. Run `cd /Users/pretheesh/Projects/ubot && git log --oneline -7` to show all the commits
      2. Run `make update` to build and deploy everything
      3. After deploy, SSH to ubot-server and verify:
         - `curl -s http://127.0.0.1:9222/json/version` returns Chrome info (CDP alive)
         - `ubot logs | grep "playwright"` shows Playwright MCP connected
         - `ubot logs | grep "Health"` shows health monitor running
      4. Report the results

      Do NOT clear any chat messages or digests — preserve user data.
