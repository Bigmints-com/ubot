<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Chat — powered by UBOT" />
  <!-- manifest link set dynamically by script to include owner key for PWA -->
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.svg" />
  <title>Chat</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --accent:#6366f1;--accent-h:#818cf8;
      --bg:#09090b;--surface:#18181b;--surface2:#27272a;
      --border:#27272a;--text:#fafafa;--muted:#71717a;
      --danger:#ef4444;--radius:16px;
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
    }
    html,body{height:100%;overflow:hidden;margin:0}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--bg);color:var(--text);
    }

    /* ── App shell: flex column sized to visual viewport ── */
    #app{
      display:flex;flex-direction:column;
      height:100vh; /* JS overrides to visualViewport.height */
      width:100%;overflow:hidden;
      position:fixed;top:0;left:0; /* pin to top-left so iOS can't scroll it */
    }

    /* ── Header: pinned at top ── */
    .header{
      flex-shrink:0;
      display:flex;align-items:center;gap:12px;
      padding:0 20px;
      min-height:60px;
      padding-top:var(--safe-top);
      border-bottom:1px solid var(--border);
      background:var(--bg);
      z-index:10;
    }
    .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-h));display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:600;font-size:14px;color:#fff;overflow:hidden}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .title{font-weight:600;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .header-actions{display:flex;gap:2px}
    .icon-btn{width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
    .icon-btn:hover{background:var(--surface);color:var(--text)}
    .icon-btn svg{width:16px;height:16px}

    /* ── Messages: scrollable middle ── */
    .messages{
      flex:1;min-height:0;
      overflow-y:auto;-webkit-overflow-scrolling:touch;
      padding:16px;
      display:flex;flex-direction:column;gap:8px;
      scrollbar-width:thin;scrollbar-color:var(--surface2) transparent;
    }
    .messages::-webkit-scrollbar{width:3px}
    .messages::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:3px}
    .welcome{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px;line-height:1.6}
    .msg{max-width:80%;padding:10px 14px;border-radius:var(--radius);font-size:14px;line-height:1.55;word-wrap:break-word;animation:in .2s ease}
    @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .msg-user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
    .msg-bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:6px}
    .msg-time{font-size:10px;margin-top:3px;opacity:.5}
    .msg-user .msg-time{text-align:right;color:rgba(255,255,255,.5)}
    .msg-bot .msg-time{color:var(--muted)}

    /* Voice */
    .msg-voice{display:flex;align-items:center;gap:8px;min-width:140px}
    .msg-voice .play-btn{width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .msg-user .play-btn{background:rgba(255,255,255,.2);color:#fff}
    .msg-bot .play-btn{background:var(--surface2);color:var(--text)}
    .play-btn svg{width:14px;height:14px}
    .msg-voice .dur{font-size:11px;opacity:.7}
    .msg-voice .waveform{flex:1;height:24px;display:flex;align-items:center;gap:1px}
    .waveform .bar{width:2px;background:currentColor;border-radius:1px;opacity:.4;min-height:3px}

    /* Image */
    .msg-img{max-width:240px;border-radius:12px;margin-top:6px}
    .msg-img img{width:100%;border-radius:12px;display:block}

    .typing{display:flex;gap:4px;padding:12px 16px;align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);border-bottom-left-radius:6px}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.4s ease-in-out infinite}
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

    /* ── Input row: pinned at bottom ── */
    .input-row{
      flex-shrink:0;
      padding:12px 16px;
      padding-bottom:calc(12px + var(--safe-bottom));
      border-top:1px solid var(--border);
      display:flex;gap:8px;
      background:var(--bg);
      align-items:flex-end;
      z-index:10;
    }
    .input-row.kb-open{padding-bottom:12px} /* no safe area when keyboard is up */
    .input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;resize:none;min-height:40px;max-height:120px}
    .input:focus{border-color:var(--accent)}
    .input::placeholder{color:var(--muted)}
    .action-btn{width:40px;height:40px;border-radius:12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
    .send-btn{background:var(--accent)}
    .send-btn:hover{opacity:.9}
    .send-btn:active{transform:scale(.95)}
    .send-btn:disabled{opacity:.4;cursor:not-allowed}
    .send-btn svg{width:18px;height:18px;fill:#fff}
    .mic-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted)}
    .mic-btn:hover{color:var(--text);background:var(--surface2)}
    .mic-btn.recording{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse 1.5s ease-in-out infinite}
    .mic-btn svg{width:18px;height:18px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
    .attach-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted)}
    .attach-btn:hover{color:var(--text);background:var(--surface2)}
    .attach-btn svg{width:18px;height:18px}
    #file-input{display:none}

    /* Recording bar */
    .rec-bar{display:none;flex-shrink:0;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);align-items:center;gap:8px;font-size:12px;color:var(--danger)}
    .rec-bar.show{display:flex}
    .rec-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1s ease-in-out infinite}
    .rec-time{flex:1;font-variant-numeric:tabular-nums}
    .rec-cancel{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;font-family:inherit;padding:4px 8px}

    /* Install banner */
    .install{display:none;flex-shrink:0;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);gap:8px;align-items:center;justify-content:center}
    .install.show{display:flex}
    .install-btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit}
    .install-x{background:none;border:none;color:var(--muted);cursor:pointer;padding:0 2px;font-size:13px}

    /* Confirm dialog */
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
    .overlay.show{display:flex}
    .dialog{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:300px;width:90%;text-align:center}
    .dialog p{font-size:14px;margin-bottom:16px}
    .dialog .btns{display:flex;gap:8px;justify-content:center}
    .dialog button{padding:8px 20px;border-radius:10px;border:none;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
    .dialog .cancel{background:var(--surface2);color:var(--text)}
    .dialog .danger{background:var(--danger);color:#fff}

    /* Image preview overlay */
    .img-preview{display:none;position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.92);flex-direction:column}
    .img-preview.show{display:flex}
    .img-preview-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + var(--safe-top));flex-shrink:0}
    .img-preview-header span{font-size:14px;font-weight:500;color:var(--text)}
    .img-preview-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;padding:4px 8px}
    .img-preview-body{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:16px;min-height:0}
    .img-preview-body img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
    .img-preview-footer{flex-shrink:0;padding:12px 16px;padding-bottom:calc(12px + var(--safe-bottom));display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--border);background:var(--bg)}
    .img-preview-footer input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
    .img-preview-footer input:focus{border-color:var(--accent)}
    .img-preview-footer input::placeholder{color:var(--muted)}

    @media(max-width:480px){
      .header{padding:0 14px;padding-top:var(--safe-top)}
      .messages{padding:12px}
      .input-row{padding:10px 12px;padding-bottom:calc(10px + var(--safe-bottom))}
      .input-row.kb-open{padding-bottom:10px}
      .msg{max-width:88%}
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="avatar" id="avatar"><span id="avatar-letter">U</span></div>
      <div class="title" id="title">Chat</div>
      <div class="header-actions">
        <button class="icon-btn" id="clear-btn" title="Clear chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        </button>
      </div>
    </div>

    <div class="install" id="install-banner">
      <span>Install this app</span>
      <button class="install-btn" id="install-btn">Install</button>
      <button class="install-x" id="install-x">✕</button>
    </div>

    <div class="rec-bar" id="rec-bar">
      <div class="rec-dot"></div>
      <span class="rec-time" id="rec-time">0:00</span>
      <button class="rec-cancel" id="rec-cancel">Cancel</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-row" id="input-row">
      <button class="action-btn attach-btn" id="attach-btn" title="Send image" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>
      <input type="file" id="file-input" accept="image/*" />
      <input class="input" id="input" placeholder="Message..." autocomplete="off" />
      <button class="action-btn mic-btn" id="mic-btn" title="Voice message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="action-btn send-btn" id="send-btn">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <div class="overlay" id="confirm-overlay">
    <div class="dialog">
      <p>Clear chat history?</p>
      <div class="btns">
        <button class="cancel" id="confirm-cancel">Cancel</button>
        <button class="danger" id="confirm-clear">Clear</button>
      </div>
    </div>
  </div>

  <div class="img-preview" id="img-preview">
    <div class="img-preview-header">
      <span>Send Image</span>
      <button class="img-preview-close" id="img-preview-close">✕</button>
    </div>
    <div class="img-preview-body">
      <img id="img-preview-img" src="" alt="Preview" />
    </div>
    <div class="img-preview-footer">
      <input id="img-preview-caption" placeholder="Add a caption..." autocomplete="off" />
      <button class="action-btn send-btn" id="img-preview-send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    const BASE = location.origin;
    const SK_SESSION = 'ubot_wc_sid';
    const SK_HISTORY = 'ubot_wc_hist';
    const SK_OWNER   = 'ubot_wc_key';  // Persist owner key for PWA

    // ── Owner key: path /k/SECRET > ?key=SECRET > localStorage ──
    // iOS strips query params on Add to Home Screen, but preserves paths.
    // So the primary method is path-based: /k/boss123
    const pathMatch = location.pathname.match(/^\/k\/(.+)/);
    const params = new URLSearchParams(location.search);
    let OWNER_KEY = '';
    if (pathMatch) {
      OWNER_KEY = decodeURIComponent(pathMatch[1]);
    } else if (params.get('key')) {
      OWNER_KEY = params.get('key');
    }
    if (OWNER_KEY) {
      try { localStorage.setItem(SK_OWNER, OWNER_KEY); } catch {}
    } else {
      try { OWNER_KEY = localStorage.getItem(SK_OWNER) || ''; } catch {}
    }
    const IS_ADMIN = !!OWNER_KEY;

    // ── Dynamic manifest with owner key baked into start_url ──
    {
      const manifestUrl = OWNER_KEY
        ? '/manifest.json?key=' + encodeURIComponent(OWNER_KEY)
        : '/manifest.json';
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = manifestUrl;
      document.head.appendChild(link);
    }

    // Show attach button for admins
    if (IS_ADMIN) document.getElementById('attach-btn').style.display = '';

    let messages = [], loading = false;
    let cfg = { title: 'Chat', color: '#6366f1', welcomeMessage: '', avatarUrl: '' };

    // Session
    let sid = '';
    try { sid = localStorage.getItem(SK_SESSION) || ''; } catch {}
    if (!sid) { sid = 'wc_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); try { localStorage.setItem(SK_SESSION, sid); } catch {} }

    // Load history
    try { const s = localStorage.getItem(SK_HISTORY); if (s) messages = JSON.parse(s); } catch {}
    function saveHist() { try { localStorage.setItem(SK_HISTORY, JSON.stringify(messages.slice(-300))); } catch {} }

    function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function fmtTime(ts) { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
    function fmtDur(s) { const m = Math.floor(s / 60); return m + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }

    function renderVoice(m) {
      const bars = Array.from({ length: 20 }, () => `<div class="bar" style="height:${3 + Math.random() * 18}px"></div>`).join('');
      return `<div class="msg-voice">
        <button class="play-btn" onclick="playAudio('${m.audio}',this)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <div class="waveform">${bars}</div>
        <span class="dur">${fmtDur(m.dur || 0)}</span>
      </div>`;
    }

    function render() {
      const el = document.getElementById('messages');
      let h = '';
      if (!messages.length && cfg.welcomeMessage) h = '<div class="welcome">' + esc(cfg.welcomeMessage) + '</div>';
      for (const m of messages) {
        const cls = m.r === 'u' ? 'msg-user' : 'msg-bot';
        let content = '';
        if (m.audio) content = renderVoice(m);
        else if (m.img) {
          content = '<div class="msg-img"><img src="' + m.img + '" alt="Image" /></div>';
          if (m.t) content += '<div style="margin-top:6px">' + esc(m.t) + '</div>';
        } else content = esc(m.t);
        h += '<div class="msg ' + cls + '">' + content + '<div class="msg-time">' + fmtTime(m.ts) + '</div></div>';
      }
      if (loading) h += '<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
      el.innerHTML = h;
      requestAnimationFrame(() => el.scrollTop = el.scrollHeight);
    }

    window.playAudio = function(dataUrl, btn) {
      const a = new Audio(dataUrl);
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
      a.onended = () => { btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'; };
      a.play();
    };

    async function loadConfig() {
      try {
        const r = await fetch(BASE + '/api/config'); if (!r.ok) return;
        const d = await r.json();
        cfg.title = d.title || cfg.title; cfg.color = d.color || cfg.color;
        cfg.welcomeMessage = d.welcomeMessage || ''; cfg.avatarUrl = d.avatarUrl || '';
        document.getElementById('title').textContent = cfg.title;
        document.documentElement.style.setProperty('--accent', cfg.color);
        const av = document.getElementById('avatar');
        if (cfg.avatarUrl) av.innerHTML = '<img src="' + cfg.avatarUrl + '" alt="" />';
        else document.getElementById('avatar-letter').textContent = cfg.title.charAt(0).toUpperCase();
        render();
      } catch {}
    }

    async function sendMessage(text, audio, audioB64, audioDur, imageB64) {
      const now = Date.now();
      if (audio) messages.push({ r: 'u', t: '', audio: audioB64, dur: audioDur, ts: now });
      else if (imageB64) messages.push({ r: 'u', t: text, img: imageB64, ts: now });
      else messages.push({ r: 'u', t: text, ts: now });
      saveHist(); loading = true; render();
      try {
        const body = { session: sid, message: text || '' };
        if (OWNER_KEY) body.ownerKey = OWNER_KEY;
        if (audioB64) body.audio = audioB64;
        if (imageB64) body.image = imageB64;
        const r = await fetch(BASE + '/api/message', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (r.ok) { const d = await r.json(); if (d.response) messages.push({ r: 'b', t: d.response, ts: Date.now() }); }
        else messages.push({ r: 'b', t: 'Something went wrong.', ts: Date.now() });
      } catch { messages.push({ r: 'b', t: 'Connection error.', ts: Date.now() }); }
      loading = false; saveHist(); render();
    }

    // ── Text send ──
    document.getElementById('send-btn').addEventListener('click', () => {
      const inp = document.getElementById('input');
      const t = inp.value.trim();
      if (!t || loading) return;
      inp.value = '';
      sendMessage(t);
    });
    document.getElementById('input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('send-btn').click(); }
    });

    // ── Voice recording ──
    let mediaRec = null, audioChunks = [], recStart = 0, recTimer = null;
    document.getElementById('mic-btn').addEventListener('click', async () => {
      if (mediaRec && mediaRec.state === 'recording') { mediaRec.stop(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRec = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
        mediaRec.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRec.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          clearInterval(recTimer);
          document.getElementById('rec-bar').classList.remove('show');
          document.getElementById('mic-btn').classList.remove('recording');
          if (!audioChunks.length) return;
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const dur = (Date.now() - recStart) / 1000;
          const reader = new FileReader();
          reader.onloadend = () => { sendMessage('[Voice message]', true, reader.result, dur); };
          reader.readAsDataURL(blob);
        };
        mediaRec.start(); recStart = Date.now();
        document.getElementById('mic-btn').classList.add('recording');
        document.getElementById('rec-bar').classList.add('show');
        updateRecTime(); recTimer = setInterval(updateRecTime, 1000);
      } catch { /* mic denied */ }
    });
    function updateRecTime() { document.getElementById('rec-time').textContent = fmtDur(Math.floor((Date.now() - recStart) / 1000)); }
    document.getElementById('rec-cancel').addEventListener('click', () => {
      if (mediaRec && mediaRec.state === 'recording') { audioChunks = []; mediaRec.stop(); }
    });

    // ── Image upload (admin only) ──
    let pendingImageB64 = null;
    document.getElementById('attach-btn')?.addEventListener('click', () => document.getElementById('file-input').click());
    document.getElementById('file-input').addEventListener('change', e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onloadend = () => {
        pendingImageB64 = reader.result;
        document.getElementById('img-preview-img').src = pendingImageB64;
        document.getElementById('img-preview-caption').value = '';
        document.getElementById('img-preview').classList.add('show');
        setTimeout(() => document.getElementById('img-preview-caption').focus(), 100);
      };
      reader.readAsDataURL(file); e.target.value = '';
    });
    document.getElementById('img-preview-close').addEventListener('click', () => {
      document.getElementById('img-preview').classList.remove('show');
      pendingImageB64 = null;
    });
    document.getElementById('img-preview-send').addEventListener('click', () => {
      if (!pendingImageB64) return;
      const caption = document.getElementById('img-preview-caption').value.trim();
      sendMessage(caption, false, null, 0, pendingImageB64);
      document.getElementById('img-preview').classList.remove('show');
      pendingImageB64 = null;
    });
    document.getElementById('img-preview-caption').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('img-preview-send').click(); }
    });

    // ── Clear chat ──
    document.getElementById('clear-btn').addEventListener('click', () => document.getElementById('confirm-overlay').classList.add('show'));
    document.getElementById('confirm-cancel').addEventListener('click', () => document.getElementById('confirm-overlay').classList.remove('show'));
    document.getElementById('confirm-clear').addEventListener('click', () => {
      messages = [];
      try { localStorage.removeItem(SK_HISTORY); } catch {}
      document.getElementById('confirm-overlay').classList.remove('show');
      render();
    });

    // ── PWA ──
    let dp = null;
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; document.getElementById('install-banner').classList.add('show'); });
    document.getElementById('install-btn')?.addEventListener('click', async () => { if (dp) { dp.prompt(); await dp.userChoice; dp = null; } document.getElementById('install-banner').classList.remove('show'); });
    document.getElementById('install-x')?.addEventListener('click', () => document.getElementById('install-banner').classList.remove('show'));
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

    // ── Keyboard handling (mobile) ──
    // Resize #app to visualViewport height so flexbox naturally adjusts
    const appEl = document.getElementById('app');
    const inputRow = document.getElementById('input-row');

    function syncAppHeight() {
      const vv = window.visualViewport;
      if (!vv) return;
      const h = vv.height;
      appEl.style.height = h + 'px';
      // On iOS, visualViewport.offsetTop tells us how much the page was scrolled
      appEl.style.top = vv.offsetTop + 'px';

      const kbOpen = window.innerHeight - h > 100;
      inputRow.classList.toggle('kb-open', kbOpen);

      // Scroll messages to bottom
      requestAnimationFrame(() => {
        const el = document.getElementById('messages');
        el.scrollTop = el.scrollHeight;
      });
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncAppHeight);
      window.visualViewport.addEventListener('scroll', syncAppHeight);
      syncAppHeight(); // initial
    }

    document.getElementById('input').addEventListener('focus', () => {
      setTimeout(syncAppHeight, 300);
    });

    loadConfig();
    render();
  </script>
</body>
</html>
